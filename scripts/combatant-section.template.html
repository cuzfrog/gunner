      <section class="side-panel side-panel-{{SIDE_CLASS}} surface-panel">
        <div class="side-panel-heading-row">
          <h2 class="side-panel-heading" data-i18n="label.{{SIDE_KEY}}">{{SIDE_LABEL}}</h2>
          <div class="side-panel-heading-actions">
            <button type="button" id="{{ID_PREFIX}}-import-fitting" class="icon-button"
                    data-i18n-title="button.importFitting" data-i18n-aria-label="button.importFitting" aria-label="Import from clipboard" title="Import from clipboard">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><use href="icons.svg#import"></use></svg>
            </button>
            <div class="paste-popup popup popup-below popup-left" id="{{ID_PREFIX}}-paste-popup" hidden>
              <textarea id="{{ID_PREFIX}}-paste-input" class="paste-input" tabindex="-1" rows="1" data-i18n-aria-label="hint.pasteFitting" aria-label="Clipboard blocked. Press Ctrl+V to paste fitting."></textarea>
              <span class="paste-hint" data-i18n="hint.pasteFitting">Clipboard blocked. Press Ctrl+V to paste fitting.</span>
            </div>
            <button type="button" id="{{ID_PREFIX}}-ship-select-trigger" class="icon-button"
                    aria-haspopup="menu" aria-expanded="false" aria-controls="{{ID_PREFIX}}-ship-select-popup"
                    data-i18n-title="button.selectShip" data-i18n-aria-label="button.selectShip"
                    title="Select ship & fitting" aria-label="Select ship & fitting" disabled>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><use href="icons.svg#search"></use></svg>
            </button>
            <div class="ship-select-popup popup popup-below popup-left popup-right popup-scroll" id="{{ID_PREFIX}}-ship-select-popup" hidden role="menu"
                 data-i18n-aria-label="button.selectShip" aria-label="Select ship & fitting">
              <input type="text" class="input-field ship-select-hull" id="{{ID_PREFIX}}-hull" list="hull-options"
                     autocomplete="off" autocapitalize="off" spellcheck="false"
                     data-i18n-placeholder="hint.hullSearch" placeholder="Type ship name...">
              <span class="fitting-group-label" id="{{ID_PREFIX}}-fitting-saved-label" data-i18n="fitting.savedGroup" aria-hidden="true" hidden>Saved</span>
              <ul class="fitting-list" role="group" data-i18n-aria-label="fitting.savedGroup" aria-label="Saved" id="{{ID_PREFIX}}-fitting-saved-list"></ul>
              <span class="fitting-group-label" id="{{ID_PREFIX}}-fitting-preset-label" data-i18n="fitting.presetGroup" aria-hidden="true" hidden>Presets</span>
              <ul class="fitting-list" role="group" data-i18n-aria-label="fitting.presetGroup" aria-label="Presets" id="{{ID_PREFIX}}-fitting-preset-list"></ul>
              <p class="fitting-empty" id="{{ID_PREFIX}}-fitting-empty" role="menuitem" aria-disabled="true" data-i18n="fitting.empty" hidden>No fittings for this ship.</p>
              <span class="ship-select-hint" id="{{ID_PREFIX}}-hull-hint"></span>
            </div>
            <button type="button" id="{{ID_PREFIX}}-fitting-eye" class="fitting-eye icon-button"
                    aria-pressed="false" disabled
                    data-i18n-title="button.fittingDetails" data-i18n-aria-label="button.fittingDetails"
                    title="Show fitting details" aria-label="Show fitting details">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="icons.svg#eye"></use></svg>
            </button>
            <span class="hull-fitting-name" id="{{ID_PREFIX}}-fitting-name" hidden></span>
            <div class="fitting-preview popup popup-scroll" id="{{ID_PREFIX}}-fitting-preview" hidden aria-hidden="true"></div>
          </div>
        </div>

        <label class="form-field">
          <span class="tracking-label-row">
            <span class="field-label" data-i18n="label.trackingSpeed">Tracking speed</span>
            <span class="tracking-unit-toggle" role="group" aria-label="Tracking unit">
              <button type="button" id="{{ID_PREFIX}}-tracking-unit-rad" data-tracking-unit="rad" class="btn" aria-pressed="true">rad/s</button>
              <button type="button" id="{{ID_PREFIX}}-tracking-unit-score" data-tracking-unit="score" class="btn" aria-pressed="false" data-i18n="label.trackingScore">Score</button>
            </span>
          </span>
          <span class="input-with-unit input-with-unit-has-effective">
            <input type="number" class="input-field" id="{{ID_PREFIX}}-tracking" value="{{TRACKING_VALUE}}" step="any" min="0">
            <span class="effective-value mono" id="effective-{{EFFECTIVE_TRACKING_ID}}"></span>
          </span>
        </label>
        <div class="form-field-group">
          <span class="field-label truncate" data-i18n="label.turretSigResolution">Turret sig. resolution</span>

          <select class="input-field" id="{{ID_PREFIX}}-sigRes" hidden>
            <option value="S" selected>S (40 m)</option>
            <option value="M">M (125 m)</option>
            <option value="L">L (400 m)</option>
            <option value="XL">XL (2000 m)</option>
          </select>

          <div class="segmented-control choice-selector sigres-selector"
               id="{{ID_PREFIX}}-sig-res-options" role="group"
               data-i18n-aria-label="label.turretSigResolution" aria-label="Turret sig. resolution">
            <button type="button" data-value="S"  class="btn" aria-pressed="true"  title="S (40 m)">
              <img class="sigres-icon" alt="" hidden><span class="sigres-class">S</span><span class="sigres-value mono">(40 m)</span>
            </button>
            <button type="button" data-value="M"  class="btn" aria-pressed="false" title="M (125 m)">
              <img class="sigres-icon" alt="" hidden><span class="sigres-class">M</span><span class="sigres-value mono">(125 m)</span>
            </button>
            <button type="button" data-value="L"  class="btn" aria-pressed="false" title="L (400 m)">
              <img class="sigres-icon" alt="" hidden><span class="sigres-class">L</span><span class="sigres-value mono">(400 m)</span>
            </button>
            <button type="button" data-value="XL" class="btn" aria-pressed="false" title="XL (2000 m)">
              <img class="sigres-icon" alt="" hidden><span class="sigres-class">XL</span><span class="sigres-value mono">(2000 m)</span>
            </button>
          </div>
        </div>
        <div class="form-field-row">
          <label class="form-field">
            <span class="field-label truncate" data-i18n="label.optimalRange">Optimal range</span>
            <span class="input-with-unit input-with-unit-has-effective">
              <input type="number" class="input-field" id="{{ID_PREFIX}}-optimal" value="{{OPTIMAL_VALUE}}" step="any" min="0">
              <span class="effective-value mono" id="effective-{{EFFECTIVE_OPTIMAL_ID}}"></span>
            </span>
          </label>
          <label class="form-field">
            <span class="field-label truncate" data-i18n="label.falloffRange">Falloff range</span>
            <span class="input-with-unit input-with-unit-has-effective">
              <input type="number" class="input-field" id="{{ID_PREFIX}}-falloff" value="{{FALLOFF_VALUE}}" step="any" min="0">
              <span class="effective-value mono" id="effective-{{EFFECTIVE_FALLOFF_ID}}"></span>
            </span>
          </label>
        </div>

        <div class="form-field-group ammo-group" id="{{ID_PREFIX}}-ammo-field">
          <button type="button" id="{{ID_PREFIX}}-ammo-trigger" class="trigger"
                  aria-haspopup="true" aria-expanded="false" aria-controls="{{ID_PREFIX}}-ammo-popup"
                  data-i18n-title="button.selectAmmo" data-i18n-aria-label="button.selectAmmo"
                  title="Select ammunition" aria-label="Select ammunition">
            <span class="ammo-label truncate" data-i18n="label.ammo">Ammo</span>
            <span class="ammo-summary-row">
              <img id="{{ID_PREFIX}}-ammo-summary-icon" class="ammo-summary-icon" alt="" hidden>
              <span class="ammo-summary-value mono truncate" id="{{ID_PREFIX}}-ammo-summary"></span>
              <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="icons.svg#chevron"></use></svg>
            </span>
          </button>
          <div class="ammo-popup popup popup-below popup-left popup-right popup-scroll" id="{{ID_PREFIX}}-ammo-popup" hidden>
            <span class="fitting-group-label" id="{{ID_PREFIX}}-ammo-cargo-label" data-i18n="ammo.cargoGroup">In cargo</span>
            <ul class="ammo-list" id="{{ID_PREFIX}}-ammo-cargo-list" role="listbox"></ul>
            <button type="button" class="ammo-expand" id="{{ID_PREFIX}}-ammo-expand" data-i18n="ammo.showAll">Show all</button>
            <div id="{{ID_PREFIX}}-ammo-all-section" hidden>
              <span class="fitting-group-label" data-i18n="ammo.allGroup">All charges</span>
              <ul class="ammo-list" id="{{ID_PREFIX}}-ammo-all-list" role="listbox"></ul>
            </div>
          </div>
        </div>

        <div class="form-field-group ewar-group" id="{{ID_PREFIX}}-ewar-field">
          <button type="button" id="{{ID_PREFIX}}-ewar-trigger" class="trigger"
                  aria-haspopup="dialog" aria-expanded="false" aria-controls="{{ID_PREFIX}}-ewar-popup"
                  aria-describedby="{{ID_PREFIX}}-ewar-summary-row" disabled>
            <span class="ewar-label truncate" data-i18n="label.modules">Modules</span>
            <span class="ewar-summary-row" id="{{ID_PREFIX}}-ewar-summary-row">
              <span id="{{ID_PREFIX}}-ewar-summary"></span>
              <span id="{{ID_PREFIX}}-booster-summary"></span>
            </span>
            <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="icons.svg#chevron"></use></svg>
          </button>
          <div class="ewar-popup popup popup-below popup-left popup-right popup-scroll" id="{{ID_PREFIX}}-ewar-popup" hidden role="dialog" aria-modal="false">
            <div class="preview-section" id="{{ID_PREFIX}}-ewar-section"></div>
            <div class="preview-section" id="{{ID_PREFIX}}-booster-section" hidden></div>
          </div>
        </div>

        <hr class="side-panel-divider">

        <label class="form-field">
          <span class="field-label truncate" data-i18n="label.signatureRadius">Signature radius</span>
          <span class="input-with-unit">
            <input type="number" class="input-field" id="{{ID_PREFIX}}-sig" value="{{SIG_VALUE}}" step="any" min="1">
            <span class="input-suffix mono" aria-hidden="true">m</span>
          </span>
        </label>

        <div class="form-field-group propulsion-group">
          <span class="field-label truncate" data-i18n="label.maxSpeed">Max speed</span>
          <select class="input-field" id="{{ID_PREFIX}}-propulsion" hidden disabled></select>
          <div class="propulsion-selector-wrapper">
            <div class="segmented-control propulsion-selector" id="{{ID_PREFIX}}-propulsion-options" role="group" data-i18n-aria-label="label.propulsion" aria-label="Propulsion"></div>
            <button type="button" id="{{ID_PREFIX}}-propulsion-gear" class="propulsion-gear btn icon-button" data-i18n-title="label.propulsionVariant" data-i18n-aria-label="label.propulsionVariant" aria-haspopup="menu" aria-expanded="false" aria-controls="{{ID_PREFIX}}-propulsion-variants" disabled>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><use href="icons.svg#gear"></use></svg>
            </button>
            <div class="fitting-popup propulsion-variants-popup popup popup-below popup-right" id="{{ID_PREFIX}}-propulsion-variants" role="menu" hidden data-i18n-aria-label="label.propulsionVariant" aria-label="Select propulsion variant"></div>
          </div>
          <button type="button" id="{{ID_PREFIX}}-overload-button" class="overload-button btn" data-i18n-aria-label="label.overload" data-i18n-title="label.overload" aria-pressed="true">
            <svg class="overload-button-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><use href="icons.svg#overload"></use></svg>
          </button>
          <span class="input-with-unit input-with-unit-has-effective">
            <input type="number" class="input-field" id="{{ID_PREFIX}}-speed" value="{{SPEED_VALUE}}" step="any" min="0" aria-describedby="{{ID_PREFIX}}-hull-hint" data-i18n-aria-label="label.maxSpeed" aria-label="Max speed">
            <span class="effective-value mono" id="effective-{{EFFECTIVE_SPEED_ID}}"></span>
          </span>
          <input type="checkbox" id="{{ID_PREFIX}}-overload" hidden {{OVERLOAD_CHECKED}}>
        </div>

        <div class="form-field-row">
          <label class="form-field">
            <span class="field-label truncate" data-i18n="label.mass">Mass</span>
            <span class="input-with-unit">
              <input type="number" class="input-field" id="{{ID_PREFIX}}-mass" value="{{MASS_VALUE}}" step="any" min="0">
              <span class="input-suffix mono" aria-hidden="true">kg</span>
            </span>
          </label>
          <label class="form-field">
            <span class="field-label truncate" data-i18n="label.inertiaModifier">Inertia modifier</span>
            <span class="input-with-unit">
              <input type="number" class="input-field" id="{{ID_PREFIX}}-inertia" value="{{INERTIA_VALUE}}" step="any" min="0">
              <span class="input-suffix mono" id="{{ID_PREFIX}}-align-time" aria-hidden="true">{{ALIGN_TIME_TEXT}}</span>
            </span>
          </label>
        </div>
        <div class="form-field-row">
{{MODE_OPTIONS}}
          <label class="form-field">
            <span class="field-label truncate" data-i18n="label.desiredRange">Desired range</span>
            <span class="input-with-unit">
              <input type="number" class="input-field" id="{{ID_PREFIX}}-range" value="{{RANGE_VALUE}}" step="any" min="0">
              <span class="input-suffix mono" aria-hidden="true">m</span>
            </span>
          </label>
        </div>
        <div class="form-slider-field form-maneuver-field" id="{{ID_PREFIX}}-aggressivity-field">
          <span class="form-slider-label-row">
            <span class="field-label truncate" data-i18n="label.maneuverAggressivity">Maneuver aggressivity</span>
            <button type="button" class="info-hint"
                    data-i18n-title="hint.maneuverAggressivity"
                    data-i18n-aria-label="hint.maneuverAggressivity"
                    title="Controls reactive braking as the ship approaches its set range. Higher values maneuver more aggressively, brake later, and tolerate more overshoot; lower values hold the range more strictly."
                    aria-label="About maneuver aggressivity">?</button>
            <output class="form-slider-value mono" id="{{ID_PREFIX}}-aggressivity-value" for="{{ID_PREFIX}}-aggressivity-slider">1.00</output>
          </span>
          <input type="hidden" id="{{ID_PREFIX}}-aggressivity" value="{{AGGRESSIVITY_VALUE}}">
          <input type="range" id="{{ID_PREFIX}}-aggressivity-slider" class="form-slider" min="0" max="1" step="0.001" value="{{AGGRESSIVITY_SLIDER_VALUE}}" style="--fill: 50%" data-i18n-aria-label="label.maneuverAggressivity" aria-label="Maneuver aggressivity">
        </div>
        <div class="form-field-group skill-section skill-select" id="{{ID_PREFIX}}-skill-field">
          <button type="button" class="trigger" id="{{ID_PREFIX}}-skill-trigger"
                  aria-haspopup="true" aria-expanded="false" aria-controls="{{ID_PREFIX}}-skill-popup">
            <span class="skill-label truncate" data-i18n="label.skillLevel">Pilot skills</span>
            <span class="skill-summary-row">
              <span class="skill-summary-value mono truncate" id="{{ID_PREFIX}}-skill-summary">{{SKILL_SUMMARY_TEXT}}</span>
              <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="icons.svg#chevron"></use></svg>
            </span>
          </button>
          <select class="input-field" id="{{ID_PREFIX}}-skills" hidden></select>
          <div class="skill-popup popup popup-above popup-left popup-right" id="{{ID_PREFIX}}-skill-popup" hidden>
            <div class="skill-tuner" id="{{ID_PREFIX}}-skill-options" role="group" data-i18n-aria-label="label.skillLevel" aria-label="Pilot skills"></div>
          </div>
        </div>
      </section>
