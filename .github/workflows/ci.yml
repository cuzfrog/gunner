name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Cache Pyfa SDE
        id: cache-sde
        uses: actions/cache@v4
        with:
          path: /tmp/pyfa-sde
          key: pyfa-sde-${{ hashFiles('**/generate-fitting-db.ts') }}
      - name: Clone Pyfa SDE
        if: steps.cache-sde.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/pyfa-org/Pyfa.git /tmp/pyfa-clone
          cp -r /tmp/pyfa-clone/staticdata/fsd_built /tmp/pyfa-sde
          rm -rf /tmp/pyfa-clone
      - name: Generate fitting database
        run: bun run generate:fitting-db /tmp/pyfa-sde
      - name: Type check
        run: bun run typecheck
      - name: Run tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run E2E tests
        run: bun run e2e
